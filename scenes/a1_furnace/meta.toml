# A1: a Lambertian sphere (white-furnace family, lossless configuration) in a uniform world;
# pixel = rho * Lw on the sphere and Lw elsewhere (0009 d16, d20). The sphere is convex, so the
# truth does not depend on its tessellation; pixels the sphere's edge may cross are not tested
# (truths.py sphere_pixel_classes: the rule and the mesh it reads, segments x rings).
class = "A"
units = "m"
spectra = ["rgb"]
assets = []
single_witness = false

[truth]
formula = "lambertian_furnace"
# Grey base colour rho (RGB = rho, rho, rho) and the world's constant radiance Lw.
rho = 0.5
world_radiance = 0.8
# The scene (metres, millimetres): a sphere at the origin, a pinhole camera on the -y axis.
sphere_radius = 1.0
camera_distance = 4.0
focal_mm = 50.0
sensor_mm = 36.0
# The builder's mesh: meshes.uv_sphere(sphere_radius, segments, rings).
segments = 64
rings = 32

[tolerance]
kind = "z_se"
