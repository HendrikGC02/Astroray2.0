# A1: a Lambertian sphere (white-furnace family, lossless configuration) in a uniform world;
# pixel = rho * Lw on the sphere and Lw elsewhere (0009 d16, d20). The sphere is convex, so the
# truth does not depend on its tessellation; pixels the sphere's edge may cross are not tested
# (truths.py sphere_pixel_classes: the rule and the mesh it reads, segments x rings).
class = "A"
units = "m"
spectra = ["rgb"]
assets = []
single_witness = false

[truth]
formula = "lambertian_furnace"
# Grey base colour rho (RGB = rho, rho, rho) and the world's constant radiance Lw.
rho = 0.5
world_radiance = 0.8
# The scene (metres, millimetres): a sphere at the origin, a pinhole camera on the -y axis.
sphere_radius = 1.0
camera_distance = 4.0
focal_mm = 50.0
sensor_mm = 36.0
# The builder's mesh: meshes.uv_sphere(sphere_radius, segments, rings). Its smooth normals are the
# sphere's own, tilted from each facet's geometric normal; shade_surface rejects a reflected sample
# below the geometric surface (0005 item 8), so a small fraction of the cosine lobe is lost and the
# sphere reads low by that fraction (a tessellation systematic, not an estimator error). Measured
# from the dump's bounce plane at 8192 spp: 3.65e-4 of sphere samples at 64 x 32 (sphere G 3.8e-4
# low, aggregate z about -10), 4.06e-5 at 192 x 96 (aggregate z within +-2.4). The truth stays exact
# and eps_sys 0; the mesh is fine enough that the loss is far below the per-pixel threshold.
segments = 192
rings = 96

[tolerance]
kind = "z_se"
