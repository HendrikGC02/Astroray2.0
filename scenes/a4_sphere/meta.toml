# A4 sphere: a sphere lamp over a grey Lambertian plane, camera above; pixel = rho / pi E with
# E = pi L (R / d)^2 cos theta, plus L where the lamp is seen directly (0009 d20; truths.py
# lamp_over_plane). The plane is lit by NEE and by BSDF rays crossing the lamp (shade_light),
# combined by the balance heuristic, so a wrong weight on either strategy or a wrong L shows. The
# sphere is wholly above the plane and on the camera axis; pixels its edge may cross are not tested.
class = "A"
units = "m"
spectra = ["rgb"]
assets = []
single_witness = false
# eps_sys defaults to 0: nothing in this scene is approximated.
[truth]
formula = "lamp_over_plane"
rho = 0.8
colour = [1.0, 1.0, 1.0]
# Blender watts (0003 d11, factor 1): I = P / (4 pi), and for the sphere L = P / (4 pi^2 R^2).
power = 25.0
lamp_position = [0.0, 0.0, 1.0]
lamp_radius = 0.25
# The scene (metres, millimetres): a square plane at z = 0 facing +z, a pinhole camera on the +z
# axis looking down with image +y along world +y. The builder refuses a plane that does not fill
# the view.
plane_size = 6.0
camera_height = 4.0
focal_mm = 50.0
sensor_mm = 36.0

[tolerance]
kind = "z_se"