# A5: a view-filling emitter seen through a pinhole camera; pixel = L (0009 d20).
class = "A"
units = "m"
spectra = ["rgb"]
assets = []
single_witness = false
# eps_sys defaults to 0: nothing in this scene is approximated.

[truth]
formula = "emitter_radiance"
# The emitted RGB is colour * radiance, in the working space; the world is black.
colour = [1.0, 1.0, 1.0]
radiance = 2.0
# The scene (metres, millimetres): a square plane at the origin facing +z, a pinhole camera on
# the +z axis looking at it. The builder refuses a plane that does not fill the view.
plane_size = 4.0
camera_distance = 2.0
focal_mm = 50.0
sensor_mm = 36.0

[tolerance]
kind = "z_se"
