# Small lit furnace (0004 D1 row, v1 lesson "gate every BSDF with a lit furnace"): a grey
# Lambertian plane in a constant white world plus a small bright sphere lamp outside the view,
# max_depth = 1. Pixel = rho Lw + rho Le (R / D)^2 cos theta (truths.py lit_furnace). World and
# lamp are both found by NEE and by BSDF rays, so the light pick between them and both emitter-hit
# MIS weights enter. The 0.5% of the D1 row is enforced by the Y image-mean check: the harness
# fails unless z SE of that mean is at most max_relative of the truth, so a pass bounds the
# relative error by 0.5%.
class = "A"
units = "m"
spectra = ["rgb"]
assets = []
single_witness = false
# eps_sys defaults to 0: nothing in this scene is approximated.
[truth]
formula = "lit_furnace"
rho = 0.8
colour = [1.0, 1.0, 1.0]
world_radiance = 0.02
# Blender watts (0003 d11, factor 1): Le = P / (4 pi^2 R^2), about 500 here, (R / d)^2 = 0.0025
# below the lamp.
power = 50.0
lamp_position = [1.25, 0.0, 1.0]
lamp_radius = 0.05
max_depth = 1
# The scene (metres, millimetres): as A4. The truth refuses a lamp inside the view.
plane_size = 6.0
camera_height = 4.0
focal_mm = 50.0
sensor_mm = 36.0

[tolerance]
kind = "z_se"
max_relative = 0.005
