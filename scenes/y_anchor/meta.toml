# y_anchor: an RGB white emitter of strength 1 filling a pinhole camera's view; display Y = 1
# (0003 d11, check 11, render part).
class = "A"
units = "m"
spectra = ["rgb"]
assets = []
single_witness = false
# 0003 check 11 states the anchor as display Y = 1 within 1e-3.
eps_sys = 1e-3

[truth]
formula = "display_luminance"
# The emitted RGB is colour * radiance, in the working space; the world is black.
colour = [1.0, 1.0, 1.0]
radiance = 1.0
# The scene (metres, millimetres), as A5's: a square plane at the origin facing +z, a pinhole camera
# on the +z axis looking at it. The builder refuses a plane that does not fill the view.
plane_size = 4.0
camera_distance = 2.0
focal_mm = 50.0
sensor_mm = 36.0

[tolerance]
kind = "z_se"