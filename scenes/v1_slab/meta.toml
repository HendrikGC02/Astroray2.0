# SPDX-License-Identifier: Apache-2.0
# 0006 V1 scene: a closed box of thickness d holding a chromatic absorbing medium over the left half
# of the view, in front of a view-filling white emitter. The box's surface has opacity 0, so a ray
# passes it and the medium decides the pixel. A lane at wavelength l through the box sees
# exp(-sigma_a(l) d / cos theta), where sigma_a(l) = D (1 - S_c(l)) is the medium's lift of the RGB
# triple (D = max(sigma_a), c = 1 - sigma_a / D, S_c the colour's reflectance sigmoid); the display
# colour of a pixel is that transmittance through the observer (truths.py beer_lambert_slab). The
# right half sees the emitter directly, so a fault that touches unmediated pixels shows too. The RGB
# triple is not a per-channel coefficient: exp(-sigma_c d) per channel is only approximate.
class = "A"
units = "m"
spectra = ["rgb"]
assets = []
single_witness = false
# eps_sys defaults to 0: the truth is the observer-grid sum the film converges to.

[truth]
formula = "beer_lambert_slab"
# Absorption in 1/m, one value per RGB channel; no scattering.
sigma_a = [0.5, 1.0, 2.0]
sigma_s = [0.0, 0.0, 0.0]
g = 0.0
# Metres and millimetres: the emitter at the origin facing +z, the slab's lower face 0.05 m above it
# and its right side face in the plane x = 0, the camera on the +z axis looking down. The builder
# refuses a view the emitter does not fill or whose left half the slab does not cover.
thickness = 0.5
slab_size = 3.0
gap = 0.05
colour = [1.0, 1.0, 1.0]
radiance = 1.0
plane_size = 4.0
camera_distance = 2.0
focal_mm = 50.0
sensor_mm = 36.0

[tolerance]
kind = "z_se"
