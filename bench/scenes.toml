# Benchmark scenes (0009 d22, d23). b1m and b5m (B-1M, B-5M) are added by task 089.
#   name:      scene id (the scenes/ directory) used in bench/history lines
#   recording: path under out/scenes/
#   class:     "B" (benchmark class)
#   sets:      milestones whose set includes the scene
[[scene]]
name = "b1m"
recording = "b1m.arrec"
class = "B"
sets = ["M1a"]

[[scene]]
name = "b5m"
recording = "b5m.arrec"
class = "B"
sets = ["M1a"]
