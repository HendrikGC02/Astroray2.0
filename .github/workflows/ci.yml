# Hosted CI (0009 d24): CPU build and gate tests from a clean checkout. No secrets.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python tool packages
        shell: pwsh
        run: python -m pip install --require-hashes --no-deps -r .github/ci-requirements.txt
      - name: Ninja
        shell: pwsh
        run: |
          # URL and SHA-256 come from third_party/deps.toml (name ninja, kind tool-binary).
          $d = python -I -c "import tomllib;d=[x for x in tomllib.load(open('third_party/deps.toml','rb'))['dep'] if x['name']=='ninja'][0];print(d['url']);print(d['sha256'])"
          $zip = Join-Path $env:RUNNER_TEMP 'ninja-win.zip'
          Invoke-WebRequest -Uri $d[0] -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $d[1]) { throw 'ninja SHA-256 mismatch' }
          $dir = Join-Path $env:RUNNER_TEMP 'ninja'
          Expand-Archive $zip $dir
          Add-Content $env:GITHUB_PATH $dir
      - name: check ci
        shell: pwsh
        env:
          CI: 'true'
        run: pwsh tools/check.ps1 ci
      # ci.log names a failing doctest case and build.log holds the compiler's
      # error line; check.ps1's 20-line summary carries neither (0009 d24).
      - name: Upload ci logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            out/check/ci.log
            out/check/build.log
          if-no-files-found: warn
          retention-days: 7
