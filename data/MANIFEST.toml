# Every shipped data file (0001 D8.4): one [[file]] entry each, `path` relative to data/.
# Required: path, spdx or url, citation, version, sha256, command. tools/lint.py section `data`
# checks them against the files; cmake/data.cmake embeds every listed path as RCDATA.

