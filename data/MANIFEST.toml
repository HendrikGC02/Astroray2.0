[[file]]
path = "tables/e_diel_refl.bin"
spdx = "Apache-2.0"
citation = "E_diel(mu, r, eta): directional albedo of the GGX dielectric reflection lobe (src/kernel/material/lobes/ggx.h, specular_weight 1, specular_color 1), 16^3, mu in [0,1], r = (alpha_x alpha_y)^(1/4) in [0,1], eta in [1,3], 2^16 stratified importance samples per cell. Generated by tools/etables from the engine's own lobe code; the header holds the SHA-256 of ggx.h, fresnel.h and delta.h. Method: Kulla and Conty 2017 (SIGGRAPH course); 0005 item 6. Layout: src/kernel/material/lobes/tables.h."
licence = "Generated from this repository's Apache-2.0 lobe code; no third-party data."
version = "e_diel_refl v1 (generator 1)"
sha256 = "68c403ca0440b03c98962d3db207bf64baf161f016f83afe3fe4038a820a9ade"
command = "pwsh tools/build.ps1 -Target etables; out/bin/etables.exe e_diel_refl"
