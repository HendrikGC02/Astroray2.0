# Family sizes, 0009 d15. gate_statistical and the gate's sample counts are measured, not
# provisional: the detection-power task (078) injected a missing cosine, a wrong GGX Jacobian, a 1%
# EON albedo error, a flipped front face and a lane-0 hero, and the gate caught each at these values.
[family]
gate_statistical = 2000

[family_provisional]
full_statistical = 2000
analytic_scenes = 256

# Members each suite runs, held to at most its m by lint (0009 d15). analytic_scenes: one per check
# (scene channel, or image mean) of each gate scene on each device, plus the truth-tested renders of
# tools/integrator_checks.py; tools/analytic.py --gate refuses to run when its own count differs.
[family_members]
analytic_scenes = 70
